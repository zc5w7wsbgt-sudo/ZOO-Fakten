name: Freigegebene Instagram-Beiträge veröffentlichen

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Warteschlange prüfen und veröffentlichen
        env:
          ENABLE_PUBLISHING: ${{ vars.ENABLE_PUBLISHING }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python instagram_publisher.py
      - name: Veröffentlichungsstatus speichern
        run: |
          if git diff --quiet -- posts/queue.json; then exit 0; fi
          git config user.name "Zoo Fakten Bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/queue.json
          git commit -m "Instagram-Veröffentlichungsstatus aktualisieren"
          git push
